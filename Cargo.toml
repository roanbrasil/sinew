[workspace]
resolver = "3"
members = ["crates/*", "samples/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
authors = ["Roan Brasil"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/roanbrasil/sinew"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "json"] }
tempfile = "3"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
schemars = "1"
sinew-core = { path = "crates/sinew-core", version = "0.1.0" }
sinew-macros = { path = "crates/sinew-macros", version = "0.1.0" }
sinew-graph = { path = "crates/sinew-graph", version = "0.1.0" }
sinew-trace = { path = "crates/sinew-trace", version = "0.1.0" }
sinew-checkpoint = { path = "crates/sinew-checkpoint", version = "0.1.0", default-features = false }
sinew-eval = { path = "crates/sinew-eval", version = "0.1.0" }
axum = "0.8"
futures = "0.3"
regex = "1"
sinew-mcp = { path = "crates/sinew-mcp", version = "0.1.0" }
sinew-harness = { path = "crates/sinew-harness", version = "0.1.0", default-features = false }
sinew-rag = { path = "crates/sinew-rag", version = "0.1.0", default-features = false }
globset = { version = "0.4", default-features = false }
walkdir = "2"
csv = "1"
pdf-extract = "0.12"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
tower-http = { version = "0.7", features = ["cors"] }
tokio-util = "0.7"
bytes = "1"
sinew-serve = { path = "crates/sinew-serve", version = "0.1.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stderr = "allow"
large_futures = "warn"
needless_pass_by_value = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
