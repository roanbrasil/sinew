[workspace]
resolver = "3"
members = ["crates/*", "samples/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Roan Brasil"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/roanbrasil/sinew"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls"] }
tempfile = "3"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
schemars = "1"
sinew-core = { path = "crates/sinew-core", version = "0.1.0" }
sinew-graph = { path = "crates/sinew-graph", version = "0.1.0" }
sinew-trace = { path = "crates/sinew-trace", version = "0.1.0" }
sinew-checkpoint = { path = "crates/sinew-checkpoint", version = "0.1.0", default-features = false }
sinew-eval = { path = "crates/sinew-eval", version = "0.1.0" }
axum = "0.8"
futures = "0.3"
regex = "1"
sinew-mcp = { path = "crates/sinew-mcp", version = "0.1.0" }
sinew-harness = { path = "crates/sinew-harness", version = "0.1.0" }
