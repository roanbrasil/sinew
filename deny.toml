# cargo-deny: license, advisory, ban and source checks (run in CI).
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained transitive crates (e.g. ttf-parser under the optional `pdf` feature) are
# reviewed when bumping; only direct dependencies fail the check.
unmaintained = "workspace"
ignore = [
  # Bundled SQLite < 3.54 (via sqlx 0.8 -> libsqlite3-sys 0.30). Only reachable when
  # opening a database plus `-wal` file written by an untrusted party. Fixed by
  # moving to sqlx 0.9 (needs Rust 1.94); tracked in CHANGELOG "Unreleased".
  { id = "RUSTSEC-2026-0459", reason = "local-only, pending sqlx 0.9 upgrade" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "BSL-1.0",
  "0BSD",
]

[licenses.private]
# Samples are `publish = false` and not distributed.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
