[package]
name = "sample-22-mcp-microservice"
description = "A Rust microservice that exposes typed tools over MCP (Streamable HTTP) and an agent that uses them"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
sinew = { path = "../../crates/sinew", features = ["mcp-http"] }
sample-common = { path = "../common" }
tokio = { workspace = true, features = ["net", "signal"] }
serde_json.workspace = true
serde.workspace = true
schemars.workspace = true
axum.workspace = true

[lints]
workspace = true
