version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Its tags are Rust versions: `@stable` follows releases and `@1.88` is the
      # MSRV pin, which must only change together with `rust-version`.
      - dependency-name: dtolnay/rust-toolchain
