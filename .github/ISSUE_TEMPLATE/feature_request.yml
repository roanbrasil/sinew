name: Feature request
description: Propose a new capability or provider
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What are you trying to build, and what is missing today?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposal
      description: API sketch, or how LangChain/LangGraph/LangSmith handles it, if relevant.
