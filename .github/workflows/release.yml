name: Release
on:
  push:
    branches: [main]
permissions: {}
jobs:
  # Publishes crates whose version is not on crates.io yet (after a release PR
  # is merged), then tags and creates the GitHub Release.
  release:
    # Off until trusted publishing is configured (see RELEASING.md):
    # Settings → Secrets and variables → Actions → Variables → RELEASE_ENABLED=true
    if: github.repository_owner == 'roanbrasil' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      id-token: write # crates.io trusted publishing (OIDC), no CARGO_REGISTRY_TOKEN
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - id: release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: GitHub Release from CHANGELOG.md
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          version=$(echo "$RELEASES" | jq -r '.[] | select(.package_name == "sinew") | .version')
          [ -n "$version" ] || exit 0
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { f = 1; next }
            /^## \[/ || /^\[Unreleased\]/ { f = 0 }
            f' CHANGELOG.md > notes.md
          printf '\n## Install\n\n```bash\ncargo add sinew@%s --features full\n```\n' "$version" >> notes.md
          gh release create "v$version" --title "Sinew $version" --notes-file notes.md --verify-tag

  # Opens or updates the release PR (version bump) on every push to main.
  release-pr:
    if: github.repository_owner == 'roanbrasil' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
