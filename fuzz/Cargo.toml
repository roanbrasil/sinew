[package]
name = "sinew-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "cargo-fuzz targets for Sinew's parsers of untrusted input"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sinew-core = { path = "../crates/sinew-core", features = ["macros"] }
sinew-mcp = { path = "../crates/sinew-mcp", features = ["http-server"] }
sinew-a2a = { path = "../crates/sinew-a2a" }
sinew-rag = { path = "../crates/sinew-rag", default-features = false }
sinew-scope = { path = "../crates/sinew-scope", features = ["otlp-proto"] }
sinew-trace = { path = "../crates/sinew-trace", features = ["otlp", "otlp-proto"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros", "time"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# Its own workspace: the fuzz crate is not part of the main build, and needs
# nightly only for `cargo fuzz` (the replay tests run on stable).
[workspace]
members = ["."]

[profile.release]
debug = 1


[lib]
path = "src/lib.rs"

[[bin]]
name = "sse_parser"
path = "fuzz_targets/sse_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stream_anthropic"
path = "fuzz_targets/stream_anthropic.rs"
test = false
doc = false
bench = false

