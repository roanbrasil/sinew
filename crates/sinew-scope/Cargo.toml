[package]
name = "sinew-scope"
description = "Trace server, web UI and terminal viewer for Sinew (LangSmith-style)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sinew-scope"
path = "src/main.rs"

[dependencies]
sinew-trace.workspace = true
sinew-eval.workspace = true
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
sqlx = { workspace = true, features = ["sqlite"] }
tokio = { workspace = true, features = ["net", "signal", "fs"] }
thiserror.workspace = true

[dev-dependencies]
sinew-core.workspace = true
sinew-graph.workspace = true
sinew-trace = { workspace = true, features = ["http"] }
reqwest.workspace = true
