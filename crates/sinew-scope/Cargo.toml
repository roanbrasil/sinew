[package]
name = "sinew-scope"
description = "Trace server, web UI and terminal viewer for Sinew (LangSmith-style)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["llm", "observability", "tracing", "evaluation", "langsmith"]
categories = ["development-tools::debugging", "web-programming::http-server"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "sinew-scope"
path = "src/main.rs"

[features]
default = []
# Accept OTLP/HTTP protobuf (`application/x-protobuf`) on `/v1/traces`.
otlp-proto = ["sinew-trace/otlp-proto"]

[dependencies]
sinew-core.workspace = true
sinew-trace.workspace = true
sinew-eval.workspace = true
reqwest.workspace = true
uuid.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
sqlx = { workspace = true, features = ["sqlite"] }
tokio = { workspace = true, features = ["net", "signal", "fs"] }
thiserror.workspace = true
futures-util.workspace = true

[dev-dependencies]
sinew-graph.workspace = true
sinew-trace = { workspace = true, features = ["http", "otlp"] }
tempfile.workspace = true

[lints]
workspace = true
