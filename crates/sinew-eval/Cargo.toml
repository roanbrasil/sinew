[package]
name = "sinew-eval"
description = "Datasets, evaluators and experiments for Sinew (LangSmith-style evaluation)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["llm", "evaluation", "datasets", "benchmark", "langsmith"]
categories = ["development-tools::testing", "science"]

[features]
# `sinew_eval::rag`: RAG metrics (faithfulness, context precision/recall, retrieval
# metrics, embedding similarity) and synthetic test-set generation.
rag = ["dep:sinew-rag"]

[dependencies]
sinew-core.workspace = true
sinew-trace.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
thiserror.workspace = true
reqwest.workspace = true
uuid.workspace = true
futures.workspace = true
regex.workspace = true
sinew-rag = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
