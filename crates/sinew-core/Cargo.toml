[package]
name = "sinew-core"
description = "Model, message, tool and prompt abstractions for Sinew"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["llm", "openai", "anthropic", "gemini", "ollama"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
thiserror.workspace = true
reqwest.workspace = true
futures-core.workspace = true
futures-util.workspace = true
regex.workspace = true
tokio = { version = "1", default-features = false, features = ["time", "sync", "rt"] }
schemars = { workspace = true, optional = true }
sinew-macros = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true, features = ["sqlite"] }

[features]
default = ["http2"]
# `StructuredOutput::for_type::<T>()`: derive the JSON Schema from a Rust type.
schemars = ["dep:schemars"]
# `#[tool]` attribute macro and `tools!`: functions become tools, schema from argument types.
macros = ["schemars", "dep:sinew-macros"]
# Negotiate HTTP/2 (ALPN) with providers that support it.
http2 = ["reqwest/http2"]
# `cache::SqliteCache`: persistent response cache.
sqlite-cache = ["dep:sqlx"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "net", "io-util"] }
tempfile.workspace = true
trybuild = "1"
criterion.workspace = true

[lints]
workspace = true

[[bench]]
name = "context"
harness = false

[[test]]
name = "tool_macro"
required-features = ["macros"]

[[test]]
name = "prompt_macro"
required-features = ["macros"]
