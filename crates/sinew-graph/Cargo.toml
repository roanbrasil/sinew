[package]
name = "sinew-graph"
description = "Typed state-graph engine for LLM agents: loops, branching, checkpoints, human-in-the-loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["llm", "agents", "langgraph", "state-machine", "workflow"]
categories = ["asynchronous", "science"]

[dependencies]
sinew-macros = { workspace = true, optional = true }
sinew-core.workspace = true
sinew-trace.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
thiserror.workspace = true
uuid.workspace = true
tokio.workspace = true
futures-core.workspace = true

[features]
# `#[derive(State)]`: field-wise reducers for parallel branches.
macros = ["dep:sinew-macros"]
# Authenticated messages between agents (OWASP ASI07): `MessageAuth`,
# `PeerAgentTool`, `Supervisor::message_auth`, `Swarm::message_auth`.
identity = ["sinew-core/identity"]

[dev-dependencies]
trybuild = "1"
tempfile.workspace = true
futures-util.workspace = true
criterion.workspace = true

[[bench]]
name = "superstep"
harness = false

[lints]
workspace = true

[[test]]
name = "derive_state"
required-features = ["macros"]

[[test]]
name = "peer_messages"
required-features = ["identity"]
