[package]
name = "sinew-trace"
description = "Run tracing for Sinew graphs, models and tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["llm", "tracing", "observability", "opentelemetry", "langsmith"]
categories = ["development-tools::debugging", "asynchronous"]

[dependencies]
sinew-core.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
regex.workspace = true
reqwest = { workspace = true, features = ["blocking"], optional = true }

[features]
default = []
# Background batching sink that POSTs runs to a `sinew-scope serve` instance.
http = ["dep:reqwest"]
# `OtlpSink`: export runs as OpenTelemetry spans (OTLP/HTTP JSON).
otlp = ["dep:reqwest"]
# OTLP protobuf codec (no extra dependencies); enables `OtlpProtocol::HttpProtobuf`.
otlp-proto = []

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
