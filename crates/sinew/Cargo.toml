[package]
name = "sinew"
description = "LLM chains, agent graphs and tracing in Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["llm", "agents", "langchain", "ai", "rag"]
categories = ["api-bindings", "asynchronous", "science"]

[features]
default = ["macros"]
# `#[sinew::tool]` and `tools!`: plain functions become tools (schemas via schemars).
macros = ["sinew-core/macros", "sinew-graph/macros"]
# Durable checkpointers (`sinew::checkpoint`).
sqlite = ["dep:sinew-checkpoint", "sinew-checkpoint/sqlite"]
postgres = ["dep:sinew-checkpoint", "sinew-checkpoint/postgres"]
# Model Context Protocol client and server (`sinew::mcp`).
mcp = ["dep:sinew-mcp"]
# MCP over Streamable HTTP: client transport plus `McpServer::http_router` (axum) for microservices.
mcp-http = ["mcp", "sinew-mcp/http", "sinew-mcp/http-server"]
# OAuth 2.1 for MCP over HTTP: JWT validation on the server, authorization code + PKCE on the client.
mcp-oauth = ["mcp-http", "sinew-mcp/oauth"]
# Datasets and evaluations (`sinew::eval`).
eval = ["dep:sinew-eval"]
# `HttpSink`: ship traces to a `sinew-scope serve` instance.
http-trace = ["sinew-trace/http"]
# `OtlpSink`: export traces to any OpenTelemetry collector (`otlp-proto` adds protobuf).
otlp = ["sinew-trace/otlp"]
otlp-proto = ["otlp", "sinew-trace/otlp-proto"]
# Retrieval: embeddings, loaders, splitters, vector stores, retrievers (`sinew::rag`).
rag = ["dep:sinew-rag", "sinew-rag/sqlite", "sinew-mcp?/rag", "sinew-eval?/rag"]
pgvector = ["rag", "sinew-rag/pgvector"]
qdrant = ["rag", "sinew-rag/qdrant"]
pdf = ["rag", "sinew-rag/pdf"]
# Agent2Agent protocol client and server (`sinew::a2a`).
a2a = ["dep:sinew-a2a"]
# Agent harness: built-in tools, subagents, permissions, compaction (`sinew::harness`).
harness = ["dep:sinew-harness", "sinew-memory?/harness", "sinew-govern?/harness"]
# Built-in tools: web search, web fetch, Wikipedia, calculator, date/time, HTTP, e-mail (`sinew::builtin_tools`).
# Depend on `sinew-tools` directly to pick single tool families.
tools = ["dep:sinew-tools", "sinew-tools/full"]
# Long-term memory across threads: extraction, dedup, recall (`sinew::memory`).
memory = ["dep:sinew-memory"]
# Deployment server and client with an OpenAI-compatible endpoint (`sinew::serve`).
serve = ["dep:sinew-serve", "sinew-serve/sqlite"]
# Agent control plane: policies for tool and model calls, registry, kill switch (`sinew::govern`).
# With `harness`, also `GovernHook`.
govern = ["dep:sinew-govern"]
# Cedar policies in the control plane (`CedarPolicy`; adds the cedar-policy crate, not in `full`).
govern-cedar = ["govern", "sinew-govern/cedar"]
# Open Policy Agent policies in the control plane (`OpaPolicy`).
govern-opa = ["govern", "sinew-govern/opa"]
# Signed agent identity, trust store and call verification (`sinew::core::identity`);
# with `govern`, `ControlPlane::register_verified`.
identity = ["sinew-core/identity", "sinew-govern?/identity"]
# Persistent response cache for chat models.
sqlite-cache = ["sinew-core/sqlite-cache"]
# Derive structured-output schemas from Rust types.
schemars = ["sinew-core/schemars"]
# Everything above except Postgres-backed features and `govern-cedar`.
full = ["sqlite", "mcp", "mcp-http", "mcp-oauth", "eval", "http-trace", "otlp", "rag", "qdrant", "pdf", "a2a", "harness", "serve", "sqlite-cache", "schemars", "macros", "memory", "tools", "govern", "govern-opa", "identity"]

[dependencies]
sinew-core.workspace = true
sinew-graph.workspace = true
sinew-trace.workspace = true
sinew-checkpoint = { workspace = true, optional = true, default-features = false }
sinew-mcp = { path = "../sinew-mcp", version = "0.1.0", optional = true }
sinew-eval = { workspace = true, optional = true }
sinew-rag = { workspace = true, optional = true }
sinew-a2a = { path = "../sinew-a2a", version = "0.1.0", optional = true }
sinew-harness = { workspace = true, optional = true, default-features = false }
sinew-serve = { workspace = true, optional = true, default-features = false }
sinew-memory = { workspace = true, optional = true }
sinew-tools = { workspace = true, optional = true }
sinew-govern = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-util.workspace = true

[lints]
workspace = true
