[package]
name = "sinew-mcp"
description = "Model Context Protocol client and server for Sinew tools and agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["mcp", "protocol", "llm", "agents", "tools"]
categories = ["api-bindings", "network-programming", "asynchronous"]

[features]
default = []
# Streamable HTTP client transport (uses reqwest, already a dependency of sinew-core).
http = ["dep:reqwest"]
# Streamable HTTP server transport: `McpServer::http_router` / `serve_http` (axum).
http-server = ["dep:axum", "dep:uuid", "dep:futures-util", "tokio/net"]
# `ResourceContents::to_document` and `McpClient::read_resource_documents` (sinew-rag `Document`s).
rag = ["dep:sinew-rag"]
# OAuth 2.1 client for the HTTP transport: discovery, dynamic client
# registration, authorization code + PKCE, refresh, `McpClient::connect_http_with_oauth`.
oauth-client = ["http", "dep:ring", "dep:base64"]
# OAuth 2.1 resource server for `http_router`: protected resource metadata and
# JWT access-token validation against a JWKS (`McpHttpConfig::with_oauth`).
oauth-server = ["http-server", "dep:jsonwebtoken", "dep:reqwest"]
# Both of the above.
oauth = ["oauth-client", "oauth-server"]

[[bin]]
name = "sinew-mcp"
path = "src/bin/sinew-mcp.rs"

[dependencies]
sinew-core = { workspace = true, features = ["identity"] }
sinew-graph.workspace = true
sinew-trace.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "io-std"] }
reqwest = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
sinew-rag = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["net"] }
reqwest.workspace = true
axum.workspace = true
# PEM keys to sign test tokens.
jsonwebtoken = { workspace = true, features = ["use_pem"] }
base64.workspace = true
tempfile.workspace = true

[lints]
workspace = true
